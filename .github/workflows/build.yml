name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==0.29.34"
          python -m pip install pexpect

      - name: Install Compatible Android NDK (r25c)
        run: |
          sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_PATH=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Check architecture configuration
        run: |
          echo "Architecture-related settings:"
          grep -nEi "android\.arch|archs|p4a\.branch|requirements" buildozer.spec || true
          echo "Environment architecture variables:"
          env | grep -Ei "ANDROID_ARCH|ANDROID_ARCHS|^ARCH|^ARCHS" || true

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf "$HOME/.buildozer"
          rm -rf "$HOME/.gradle"
          rm -rf bin/

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:+UseG1GC"

      - name: Find and List Generated APK
        if: always()
        run: |
          echo "========== Searching for APK files =========="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "========== Listing bin directory =========="
          ls -lah bin/ 2>/dev/null || echo "bin directory not found"
          echo ""
          echo "========== Listing .buildozer =========="
          find .buildozer -name "*.apk" -type f 2>/dev/null | head -10
          echo ""
          echo "========== Full directory structure =========="
          ls -lah

      - name: Check APK Status
        if: success()
        run: |
          if find . -name "*.apk" -type f | grep -q .; then
            echo "✅ APK file found!"
            find . -name "*.apk" -type f -exec ls -lh {} \;
          else
            echo "⚠️ APK not found in expected locations"
            exit 0
          fi

      - name: Copy APK to bin directory
        if: success()
        run: |
          mkdir -p bin
          find . -name "*.apk" -type f ! -path "./.buildozer/android/platform/build-*/.buildozer/*" -exec cp {} bin/ \; 2>/dev/null || true
          ls -lah bin/ || true

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "========== BUILD SUMMARY =========="
          if [ -f build.log ]; then
            echo "✅ Build log generated"
            tail -50 build.log
          fi
